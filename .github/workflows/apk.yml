name: APK
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.claude/**', 'tools/**']
  workflow_dispatch:
permissions:
  contents: write
# Jedan build u isto vreme, pa izdanja izlaze redom.
concurrency:
  group: apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04 # zaključano, da prelazak ubuntu-latest na Ubuntu 26 ne promeni build bez provere
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Preuzmi kod
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" .
          git checkout -q "${GITHUB_SHA}" # tačno onaj commit koji je pokrenuo build
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"; fi
          echo "RUN_NO=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"

      # Gradle zavisnosti i build keš između build-ova (brži build, isti rezultat).
      - name: Gradle keš
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Proveri pravila, vreme i pitanja
        run: |
          out="$RUNNER_TEMP/core-tests"
          javac --release 11 -encoding UTF-8 -d "$out" $(grep -v '^#' tests/sources.txt) tests/com/cuvar/app/*Test.java
          for t in tests/com/cuvar/app/*Test.java; do
            java -Dfile.encoding=UTF-8 -cp "$out" "com.cuvar.app.$(basename "$t" .java)"
          done

      - name: Napravi unsigned APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk cuvar-unsigned.apk

      # Obećanja iz CLAUDE.md koja ne smeju da procure u izdanje (pre potpisa i objave).
      - name: Proveri privatnost i bezbednost
        run: |
          fail=0
          if "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions cuvar-unsigned.apk | grep -q "android.permission.INTERNET"; then
            echo "::error::APK traži dozvolu za internet."; fail=1
          fi
          if grep -rnE "VpnService|BIND_VPN_SERVICE" app/src/main; then
            echo "::error::VPN je uklonjen posle incidenta 10.10.2026; ne vraća se bez dogovora."; fail=1
          fi
          exit $fail

      # Rotacija ključa: stari (javni) ključ potpisuje novi tajni, pa se nova verzija
      # instalira preko stare bez brisanja podataka. Na Androidu 9+ telefon posle toga
      # prihvata samo novi ključ, pa APK potpisan samo javnim ključem ne može preko Čuvara.
      - name: Potpiši APK novim ključem
        id: sign
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          LEGACY_KEYSTORE_B64: ${{ secrets.LEGACY_KEYSTORE_B64 }}
          LEGACY_STORE_PASSWORD: ${{ secrets.LEGACY_STORE_PASSWORD }}
          LEGACY_KEY_PASSWORD: ${{ secrets.LEGACY_KEY_PASSWORD }}
          LEGACY_KEY_ALIAS: ${{ secrets.LEGACY_KEY_ALIAS }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_PASSWORD" ] || [ -z "$LEGACY_KEYSTORE_B64" ] || [ -z "$LEGACY_STORE_PASSWORD" ] || [ -z "$LEGACY_KEY_PASSWORD" ]; then
            echo "::warning::Nedostaju signing secrets; unsigned APK će biti sačuvan kao artifact, a release neće biti objavljen."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          bt="$ANDROID_HOME/build-tools/36.0.0"
          legacy="$RUNNER_TEMP/cuvar-legacy.jks"
          key="$RUNNER_TEMP/cuvar-release.jks"
          trap 'rm -f "$legacy" "$key"' EXIT
          printf '%s' "$LEGACY_KEYSTORE_B64" | base64 -d > "$legacy"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$key"
          "$bt/apksigner" rotate --out "$RUNNER_TEMP/lineage.bin" \
            --old-signer --ks "$legacy" --ks-pass env:LEGACY_STORE_PASSWORD --key-pass env:LEGACY_KEY_PASSWORD --ks-key-alias "${LEGACY_KEY_ALIAS:-cuvar}" \
            --new-signer --ks "$key" --ks-pass env:RELEASE_STORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD --ks-key-alias "${RELEASE_KEY_ALIAS:-cuvar2}"
          "$bt/apksigner" sign --rotation-min-sdk-version 28 --lineage "$RUNNER_TEMP/lineage.bin" \
            --ks "$legacy" --ks-pass env:LEGACY_STORE_PASSWORD --key-pass env:LEGACY_KEY_PASSWORD --ks-key-alias "${LEGACY_KEY_ALIAS:-cuvar}" \
            --next-signer --ks "$key" --ks-pass env:RELEASE_STORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD --ks-key-alias "${RELEASE_KEY_ALIAS:-cuvar2}" \
            --out cuvar.apk cuvar-unsigned.apk
          "$bt/apksigner" verify -v --print-certs cuvar.apk | grep -E 'Verified using|Signer|SHA-256'
          "$bt/apksigner" lineage --in cuvar.apk --print-certs
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Sačuvaj build artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cuvar-${{ github.run_number }}
          path: |
            cuvar-unsigned.apk
            cuvar.apk
          if-no-files-found: warn

      # Opis izdanja = commit-i od prethodnog izdanja (ili samo poslednji, ako tag nije nađen).
      - name: Objavi potpisani release
        if: steps.sign.outputs.signed == 'true'
        run: |
          notes="$RUNNER_TEMP/notes.md"
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then
            git log --no-merges --format='- %s' "$prev..HEAD" | head -n 30 > "$notes"
          fi
          [ -s "$notes" ] || git log -1 --format='- %s' HEAD > "$notes"
          printf '\nTelefon: preuzmi cuvar.apk.\n' >> "$notes"
          gh release delete "v$RUN_NO" --repo "$REPO" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "v$RUN_NO" cuvar.apk --repo "$REPO" --target "$GITHUB_SHA" --title "Cuvar v$RUN_NO" --notes-file "$notes"
