name: APK
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: write
# Jedan build u isto vreme, pa izdanja izlaze redom.
concurrency:
  group: apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Preuzmi kod
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" .
          git checkout -q "${GITHUB_SHA}" # tačno onaj commit koji je pokrenuo build
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"; fi
          echo "RUN_NO=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"

      - name: Proveri pravila, vreme i pitanja
        run: |
          out="$RUNNER_TEMP/core-tests"
          javac --release 11 -encoding UTF-8 -d "$out" $(grep -v '^#' tests/sources.txt) tests/com/cuvar/app/*Test.java
          for t in tests/com/cuvar/app/*Test.java; do
            java -Dfile.encoding=UTF-8 -cp "$out" "com.cuvar.app.$(basename "$t" .java)"
          done

      - name: Napravi APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk cuvar.apk

      # Rotacija ključa: stari (javni) ključ potpisuje novi tajni, pa se nova verzija
      # instalira preko stare bez brisanja podataka. Na Androidu 9+ telefon posle toga
      # prihvata samo novi ključ, pa APK potpisan samo javnim ključem ne može preko Čuvara.
      - name: Potpiši APK novim ključem
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ] || [ -z "$RELEASE_STORE_PASSWORD" ]; then
            echo "::warning::Nema RELEASE_KEYSTORE_B64/RELEASE_STORE_PASSWORD, APK ostaje potpisan starim javnim ključem."
            exit 0
          fi
          umask 077
          bt="$ANDROID_HOME/build-tools/36.0.0"
          key="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$key"
          "$bt/apksigner" rotate --out "$RUNNER_TEMP/lineage.bin" \
            --old-signer --ks app/cuvar.keystore --ks-pass pass:cuvar123 --ks-key-alias cuvar \
            --new-signer --ks "$key" --ks-pass env:RELEASE_STORE_PASSWORD --ks-key-alias cuvar2
          "$bt/apksigner" sign --rotation-min-sdk-version 28 --lineage "$RUNNER_TEMP/lineage.bin" \
            --ks app/cuvar.keystore --ks-pass pass:cuvar123 --ks-key-alias cuvar \
            --next-signer --ks "$key" --ks-pass env:RELEASE_STORE_PASSWORD --ks-key-alias cuvar2 \
            --out cuvar-rotated.apk cuvar.apk
          mv cuvar-rotated.apk cuvar.apk
          "$bt/apksigner" verify -v --print-certs cuvar.apk | grep -E 'Verified using|Signer|SHA-256'
          "$bt/apksigner" lineage --in cuvar.apk --print-certs

      # Paket za Google Play (.aab). Potpisuje se tajnim ključem iz GitHub tajni ako postoji,
      # inače istim ključem kao APK (dovoljno za interno testiranje, ključ se kasnije menja).
      - name: Napravi paket za Google Play
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          fi
          ./gradlew --no-daemon bundleRelease -Pplay
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Objavi u Releases
        run: |
          cp app/build/outputs/bundle/release/app-release.aab cuvar-play.aab
          gh release delete "v$RUN_NO" --repo "$REPO" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "v$RUN_NO" cuvar.apk cuvar-play.aab --repo "$REPO" --title "Cuvar v$RUN_NO" --notes "Telefon: preuzmi cuvar.apk. Google Play: cuvar-play.aab se šalje u Play Console."
