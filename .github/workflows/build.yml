name: Napravi APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Napravi i objavi APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NO: ${{ github.run_number }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          ZIP="$(ls *.zip | sort -V | tail -n 1)"
          echo "Koristim $ZIP"
          unzip -q "$ZIP" -d src
          bash src/build.sh
