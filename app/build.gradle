plugins {
    id 'com.android.application'
}

def runNo = (System.getenv('RUN_NO') ?: '1') as Integer

android {
    namespace 'com.cuvar.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.cuvar.app'
        minSdk 26
        targetSdk 36
        versionCode runNo
        versionName "1.${runNo}"
    }

    signingConfigs {
        // AAB za Play se potpisuje upload ključem samo kada CI eksplicitno obezbedi tajne.
        if (project.hasProperty('play') && System.getenv('UPLOAD_STORE_FILE')
                && System.getenv('UPLOAD_STORE_PASSWORD')) {
            upload {
                storeFile file(System.getenv('UPLOAD_STORE_FILE'))
                storePassword System.getenv('UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('UPLOAD_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('UPLOAD_KEY_PASSWORD') ?: System.getenv('UPLOAD_STORE_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        // APK se potpisuje u CI posle pravljenja certificate lineage-a.
        release {
            if (project.hasProperty('play') && signingConfigs.findByName('upload') != null) {
                signingConfig signingConfigs.upload
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }
}
